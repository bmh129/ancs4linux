# Remove a2dp_sink, hsp_hs, and hfp_hf so PipeWire never registers the
# "Audio Sink" UUID with BlueZ. Devices then cannot discover or use the
# laptop as a Bluetooth speaker, even transiently during WirePlumber restart.
# a2dp_source is kept so the laptop can still stream audio TO Bluetooth speakers.
# hsp_ag and hfp_ag are kept for headset microphone / call-audio-gateway use.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hsp_ag hfp_ag ]
}

# Belt-and-suspenders: also set profile off for any phone that somehow connects,
# preventing WirePlumber from activating any audio route even if roles slip through.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.form-factor = "phone"
      }
    ]
    actions = {
      update-props = {
        bluez5.profile = "off"
        bluez5.auto-connect = []
      }
    }
  }
]
